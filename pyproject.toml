[project]
name = "helpdesk"
version = "0.1.0"
description = "An IT service desk in FastAPI and SQLite: ticket lifecycle, derived priority, SLA clocks, queues, and an audit trail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
]

[tool.uv]
# This is an application, not a library: uv manages its dependencies
# but doesn't build or install the project itself.
package = false
